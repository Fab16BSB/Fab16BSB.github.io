<!-- En-tête : identité, liens de vue, langue, thème et retour au portfolio. -->
<header>
    <div class="header-inner">

      <!-- Identité : monogramme et sous-titre traduit par le module i18n. -->
      <div class="brand">
        <span class="monogram" aria-hidden="true">FP</span>
        <span class="brand-text">
          <strong>Fabien Poirier</strong>
          <span data-i18n="brandSubtitle">Graphe de connaissances</span>
        </span>
      </div>

      <!-- Raccourcis de vue : concepts, étiquettes, recentrage et libération des nœuds épinglés. -->
      <div class="toolbar" role="toolbar" aria-label="Affichage" data-i18n-aria="displayGroup">
        <button
          id="toggle-concepts"
          class="tool"
          aria-pressed="false"
          title="Afficher les concepts techniques"
          data-i18n-title="conceptsTitle"
          data-i18n-aria="conceptsTitle"
        >
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="5" r="2.5" />
            <circle cx="5" cy="18" r="2.5" />
            <circle cx="19" cy="18" r="2.5" />
            <path d="M10.8 7.2 6.2 15.8M13.2 7.2l4.6 8.6M7.5 18h9" />
          </svg>
          <span data-i18n="conceptsButton">Concepts</span>
        </button>

        <button
          id="toggle-labels"
          class="tool"
          aria-pressed="true"
          title="Afficher les étiquettes"
          data-i18n-title="labelsTitle"
          data-i18n-aria="labelsTitle"
        >
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 13.5 13.5 20 4 10.5V4h6.5L20 13.5Z" />
            <circle cx="8" cy="8" r="1.2" />
          </svg>
          <span data-i18n="labelsButton">Étiquettes</span>
        </button>

        <button id="reset-view" class="tool" title="Recentrer la vue" data-i18n-title="recenterTitle" data-i18n-aria="recenterTitle">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="6.5" />
            <path d="M12 2v4M12 18v4M2 12h4M18 12h4" />
          </svg>
          <span data-i18n="recenterButton">Recentrer</span>
        </button>

        <button id="release-nodes" class="tool" title="Relâcher les nœuds épinglés" data-i18n-title="releaseTitle" data-i18n-aria="releaseTitle">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="5" y="11" width="14" height="9" rx="2" />
            <path d="M8 11V8a4 4 0 0 1 7.5-2" />
          </svg>
          <span data-i18n="releaseButton">Relâcher</span>
        </button>
      </div>

      <!-- Actions globales : langue, thème et retour au portfolio. -->
      <div class="actions">

        <!-- Sélecteur de langue : déclencheur affichant la locale courante. -->
        <div class="lang-switch" id="lang-switch">
          <button
            type="button"
            class="lang-trigger"
            id="lang-trigger"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="lang-menu"
            aria-label="Changer de langue"
            data-i18n-aria="changeLanguage"
          >
            <svg class="flag" id="lang-flag" viewBox="0 0 60 40" aria-hidden="true" focusable="false">
              <rect width="60" height="40" fill="#0055A4" />
              <rect x="20" width="20" height="40" fill="#ffffff" />
              <rect x="40" width="20" height="40" fill="#EF4135" />
            </svg>
            <span class="lang-current" id="lang-current">Français</span>
            <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m6 9 6 6 6-6" />
            </svg>
          </button>

          <!-- Menu des locales : drapeau, libellé et coche de l'option active. -->
          <ul class="lang-menu" id="lang-menu" role="listbox" aria-label="Changer de langue" data-i18n-aria="changeLanguage" hidden>
            <li>
              <button type="button" class="lang-option active" data-lang="fr" role="option" aria-selected="true">
                <svg class="flag flag-small" viewBox="0 0 60 40" aria-hidden="true" focusable="false">
                  <rect width="60" height="40" fill="#0055A4" />
                  <rect x="20" width="20" height="40" fill="#ffffff" />
                  <rect x="40" width="20" height="40" fill="#EF4135" />
                </svg>
                <span>Français</span>
                <svg class="check" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="m5 12 4.5 4.5L19 7" />
                </svg>
              </button>
            </li>
            <li>
              <button type="button" class="lang-option" data-lang="en" role="option" aria-selected="false">
                <svg class="flag flag-small" viewBox="0 0 60 40" aria-hidden="true" focusable="false">
                  <rect width="60" height="40" fill="#012169" />
                  <path d="M0 0 60 40M60 0 0 40" stroke="#ffffff" stroke-width="8" />
                  <path d="M0 0 60 40M60 0 0 40" stroke="#C8102E" stroke-width="4" />
                  <path d="M30 0v40M0 20h60" stroke="#ffffff" stroke-width="13" />
                  <path d="M30 0v40M0 20h60" stroke="#C8102E" stroke-width="8" />
                </svg>
                <span>English</span>
                <svg class="check" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="m5 12 4.5 4.5L19 7" />
                </svg>
              </button>
            </li>
            <li>
              <button type="button" class="lang-option" data-lang="es" role="option" aria-selected="false">
                <svg class="flag flag-small" viewBox="0 0 60 40" aria-hidden="true" focusable="false">
                  <rect width="60" height="40" fill="#AA151B" />
                  <rect y="10" width="60" height="20" fill="#F1BF00" />
                  <rect x="12" y="13.5" width="6" height="9" rx="1.5" fill="#AA151B" />
                  <rect x="13.5" y="15.5" width="3" height="5" rx="0.8" fill="#F1BF00" />
                </svg>
                <span>Español</span>
                <svg class="check" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="m5 12 4.5 4.5L19 7" />
                </svg>
              </button>
            </li>
          </ul>
        </div>

        <!-- Thème clair/sombre : les deux icônes sont basculées par le script de préférences. -->
        <button
          type="button"
          class="theme-toggle"
          id="theme-toggle"
          aria-label="Changer de thème"
          data-i18n-aria="toggleTheme"
          title="Passer au thème clair"
        >
          <svg class="theme-icon theme-icon--sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42" />
          </svg>
          <svg class="theme-icon theme-icon--moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z" />
          </svg>
        </button>

        <!-- Retour vers le portfolio principal, libellé traduit. -->
        <a
          class="portfolio-link"
          id="back-to-portfolio"
          href="https://fab16bsb.github.io/"
          title="Retour au portfolio"
          aria-label="Retour au portfolio"
          data-i18n-title="backToPortfolioTitle"
          data-i18n-aria="backToPortfolioTitle"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 12H5M11 6l-6 6 6 6" />
          </svg>
        </a>

      </div>
    </div>
  </header>

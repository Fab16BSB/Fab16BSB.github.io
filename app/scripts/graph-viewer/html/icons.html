<!-- =========================================================================
     SPRITE DES ICÔNES
     Chaque symbole est référencé par <use href="#icon-..."> ou "#flag-...".
     La taille, le trait et la couleur restent sur le SVG appelant.

     Certaines icônes sont aussi utilisées par le portfolio (soleil, lune,
     recherche, croix, chevrons, drapeaux) : garder les tracés alignés avec
     app/src/components/ui/Icon et LanguageFlag.
========================================================================== -->
<svg class="icon-sprite" aria-hidden="true" focusable="false">
  <defs>

    <!-- Réseau : afficher les concepts techniques. -->
    <symbol id="icon-concepts" viewBox="0 0 24 24">
      <circle cx="12" cy="5" r="2.5" />
      <circle cx="5" cy="18" r="2.5" />
      <circle cx="19" cy="18" r="2.5" />
      <path d="M10.8 7.2 6.2 15.8M13.2 7.2l4.6 8.6M7.5 18h9" />
    </symbol>

    <!-- Cible : recentrer la vue. -->
    <symbol id="icon-recenter" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="6.5" />
      <path d="M12 2v4M12 18v4M2 12h4M18 12h4" />
    </symbol>

    <!-- Cadenas ouvert : relâcher les nœuds épinglés. -->
    <symbol id="icon-release" viewBox="0 0 24 24">
      <rect x="5" y="11" width="14" height="9" rx="2" />
      <path d="M8 11V8a4 4 0 0 1 7.5-2" />
    </symbol>

    <!-- Drapeau français : langue active ou option du sélecteur. -->
    <symbol id="flag-fr" viewBox="0 0 60 40">
      <rect width="60" height="40" fill="#0055A4" />
      <rect x="20" width="20" height="40" fill="#ffffff" />
      <rect x="40" width="20" height="40" fill="#EF4135" />
    </symbol>

    <!-- Drapeau anglais : option du sélecteur de langue. -->
    <symbol id="flag-en" viewBox="0 0 60 40">
      <rect width="60" height="40" fill="#012169" />
      <path d="M0 0 60 40M60 0 0 40" stroke="#ffffff" stroke-width="8" />
      <path d="M0 0 60 40M60 0 0 40" stroke="#C8102E" stroke-width="4" />
      <path d="M30 0v40M0 20h60" stroke="#ffffff" stroke-width="13" />
      <path d="M30 0v40M0 20h60" stroke="#C8102E" stroke-width="8" />
    </symbol>

    <!-- Drapeau espagnol : option du sélecteur de langue. -->
    <symbol id="flag-es" viewBox="0 0 60 40">
      <rect width="60" height="40" fill="#AA151B" />
      <rect y="10" width="60" height="20" fill="#F1BF00" />
      <rect x="12" y="13.5" width="6" height="9" rx="1.5" fill="#AA151B" />
      <rect x="13.5" y="15.5" width="3" height="5" rx="0.8" fill="#F1BF00" />
    </symbol>

    <!-- Chevron bas : ouvrir le menu des langues ou replier les filtres. -->
    <symbol id="icon-chevron-down" viewBox="0 0 24 24">
      <path d="m6 9 6 6 6-6" />
    </symbol>

    <!-- Chevron haut : ouvrir la feuille mobile. -->
    <symbol id="icon-chevron-up" viewBox="0 0 24 24">
      <path d="m6 15 6-6 6 6" />
    </symbol>

    <!-- Coche : langue active dans le sélecteur. -->
    <symbol id="icon-check" viewBox="0 0 24 24">
      <path d="m5 12 4.5 4.5L19 7" />
    </symbol>

    <!-- Soleil : thème clair. -->
    <symbol id="icon-sun" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42" />
    </symbol>

    <!-- Lune : thème sombre. -->
    <symbol id="icon-moon" viewBox="0 0 24 24">
      <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z" />
    </symbol>

    <!-- Maison : retour au portfolio (toit, murs, porte). -->
    <symbol id="icon-house" viewBox="0 0 24 24">
      <path d="M3 10.5 12 3l9 7.5" />
      <path d="M5.5 9.5V20h13V9.5" />
      <path d="M10 20v-5h4v5" />
    </symbol>

    <!-- Loupe : recherche plein texte. -->
    <symbol id="icon-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="7" />
      <path d="m20 20-3.5-3.5" />
    </symbol>

    <!-- Tout sélectionner : lignes de filtre et coche. -->
    <symbol id="icon-filter-all" viewBox="0 0 24 24">
      <path d="M4 7h10M4 12h10M4 17h10" />
      <path d="m17 9 2 2 4-4" />
    </symbol>

    <!-- Aucun : cercle barré pour désélectionner les filtres. -->
    <symbol id="icon-filter-none" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="7.5" />
      <path d="m7 17 10-10" />
    </symbol>

    <!-- Plus : zoomer sur le graphe. -->
    <symbol id="icon-plus" viewBox="0 0 24 24">
      <path d="M12 5v14M5 12h14" />
    </symbol>

    <!-- Moins : dézoomer sur le graphe. -->
    <symbol id="icon-minus" viewBox="0 0 24 24">
      <path d="M5 12h14" />
    </symbol>

    <!-- Croix : fermer la feuille ou le panneau de détail. -->
    <symbol id="icon-close" viewBox="0 0 24 24">
      <path d="M6 6l12 12M18 6L6 18" />
    </symbol>

  </defs>
</svg>
